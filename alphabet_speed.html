<div style="text-align: center; color: white;">
  <h2 style="color: white;">Alphabet Speed Test</h2>

  <button onclick="resetGame()" class="round-button">Ready</button><br><br>

  <h3 id="instruction" style="color: white;">Type the alphabet from A to Z</h3>
  <h3 id="sequenceDisplay" style="font-size: 28px; color: #FFD700;"></h3>

  <div>
    <span id="errorIcon" style="font-size: 32px; color: red; display: none;">❌</span>
    <span id="successMsg" style="font-size: 24px; color: lightgreen;"></span>
  </div>

  <h4 style="color: white;">Time: <span id="timer">0.000</span> seconds</h4>
</div>

<script>
  let expectedSequence = 'abcdefghijklmnopqrstuvwxyz';
  let currentIndex = 0;
  let startTime = null;
  let interval = null;

  function resetGame() {
    currentIndex = 0;
    startTime = null;
    document.getElementById('timer').textContent = '0.000';
    document.getElementById('sequenceDisplay').textContent = '';
    document.getElementById('errorIcon').style.display = 'none';
    document.getElementById('successMsg').textContent = '';
    clearInterval(interval);
  }

  function startTimer() {
    startTime = performance.now();
    interval = setInterval(() => {
      let now = performance.now();
      let elapsed = (now - startTime) / 1000;
      document.getElementById('timer').textContent = elapsed.toFixed(3);
    }, 50);
  }

  document.addEventListener('keydown', (event) => {
    const key = event.key.toLowerCase();
    if (currentIndex === 0 && key === 'a') {
      startTimer();
    }

    if (expectedSequence[currentIndex] === key) {
      currentIndex++;
      document.getElementById('sequenceDisplay').textContent = expectedSequence.slice(0, currentIndex).toUpperCase();
      document.getElementById('errorIcon').style.display = 'none';

      if (currentIndex === expectedSequence.length) {
        clearInterval(interval);
        document.getElementById('successMsg').textContent = '✅ Completed!';
      }
    } else {
      if (currentIndex !== expectedSequence.length) {
        document.getElementById('errorIcon').style.display = 'inline';
      }
    }
  });
</script>

<style>
  body {
    background-color: #2c2c2c;
    font-family: Arial, sans-serif;
  }

  .round-button {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: none;
    background-color: #E4C58A;
    color: white;
    font-size: 18px;
    cursor: pointer;
    transition: background-color 0.3s;
  }

  .round-button:hover {
    background-color: #6E1919;
  }
</style>
