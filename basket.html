<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Basket</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: black;
      overflow: hidden;
      height: 100vh;
      overflow: auto;
    }
    /* Host com barras de rolagem quando o stage ficar grande */
		#scrollHost {
		  display: flex;
		  justify-content: center; /* eixo horizontal */
		  align-items: center;     /* eixo vertical */
		  width: 100vw;
		  height: 100vh;
		  overflow: auto;          /* mantém barras se estourar a tela */
		}
		/* Stage escalável (tudo que é “o jogo” fica aqui dentro) */
		#stage {
		  --zoom: 1;
		  transform: scale(var(--zoom));
		  transform-origin: top left;  /* mantém escala a partir do canto */
		  width: max-content;
		}
    #gameCanvas {
      background: black;
      display: block;
      margin: 0 auto;
    }
    #controls {
      position: fixed; 
      bottom: 20px;
      left: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      background: rgba(0,0,0,0);
      padding: 20px;
      border-radius: 15px;
      color: white;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .control-group label {
      font-size: 14px;
      font-weight: bold;
      color: #E4C58A;
    }
    .control-group input[type="range"] {
      width: 150px;
      height: 8px;
      background: #333;
      border: none;
      border-radius: 4px;
      outline: none;
    }
    .control-group input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #E4C58A;
      cursor: pointer;
    }
    .control-value {
      font-size: 12px;
      color: #fff;
      text-align: center;
    }
    #shootButton, #resetButton, #timerToggleBtn, #timerResetBtn {
      height: 60px;
      width: 60px;
      font-size: 12px;
      background: #E4C58A;
      border: none;
      border-radius: 50px;
      color: white;
      cursor: pointer;
      margin: 10px 0;
      transition: all 0.3s;
    }
    #resetButton, #timerResetBtn { background: #E4C58A; }
    #shootButton:hover, #timerToggleBtn:hover { background: #E4C58A; transform: scale(1.05); }
    #resetButton:hover, #timerResetBtn:hover { background: #6E1919; transform: scale(1.05); }
    #shootButton:active, #resetButton:active, #timerToggleBtn:active, #timerResetBtn:active { transform: scale(0.95); }
    #shootButton:disabled { background: #666; cursor: not-allowed; transform: none; }

    #topBar {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      align-items: center;
    }
    #score, #timerDisplay {
      font-size: 20px;
      font-weight: bold;
      color: white;
      text-shadow: 2px 2px 4px rgba(0,0,0,0);
      background: rgba(0,0,0,0);
      padding: 8px 16px;
      border-radius: 25px;
    }
    .row {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .tiny {
      height: 32px !important;
      border-radius: 12px !important;
      padding: 0 12px !important;
      font-size: 12px;
    }
    #timerSeconds {
      width: 60px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #111;
      color: #fff;
      padding: 4px 8px;
      outline: none;
    }
    .hint {
      font-size: 11px;
      color: #bbb;
      line-height: 1.2;
    }
  </style>
</head>

<body>
  <div id="scrollHost">
    <div id="stage">
      <canvas id="gameCanvas" width="800" height="600"></canvas>

      <div id="topBar">
        <div id="score">Score: 0</div>
        <div id="timerDisplay">⏱ 00:00</div>
      </div>

      <div id="controls">
      	<div class="control-group">
          <label for="zoomSlider">Zoom</label>
          <input type="range" id="zoomSlider" min="50" max="150" value="100">
          <div class="control-value"><span id="zoomValue">100%</span></div>
        </div>
    <div class="control-group">
      <label for="angleSlider">Angle</label>
      <input type="range" id="angleSlider" min="0" max="90" value="45">
      <div class="control-value" id="angleValue">45°</div>
    </div>

    <div class="control-group">
      <label for="forceSlider">Strength</label>
      <input type="range" id="forceSlider" min="5" max="25" value="15">
      <div class="control-value" id="forceValue">15</div>
    </div>

    <button id="shootButton">Shoot</button>
    <button id="resetButton">Reset</button>

    <div class="control-group">
      <label for="timerSeconds">Timer</label>
      <div class="row">
        <input type="number" id="timerSeconds" min="1" max="3600" value="30" />
        <button id="timerToggleBtn" class="tiny">Start</button>
        <button id="timerResetBtn" class="tiny">Time Reset</button>
      </div>

    </div>
  </div>

  <script>
    class BasketballShooter {
      constructor() {
      	// Zoom
const zoomSlider = document.getElementById('zoomSlider');
const zoomValue  = document.getElementById('zoomValue');
const stage      = document.getElementById('stage');

function applyZoom() {
  const z = (Number(zoomSlider.value) || 100) / 100; // 0.5 a 1.5
  stage.style.setProperty('--zoom', z);
  zoomValue.textContent = Math.round(z * 100) + '%';
}

zoomSlider.addEventListener('input', applyZoom);
applyZoom(); // inicializa

        // Canvas e contexto
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');

        // Controles
        this.angleSlider = document.getElementById('angleSlider');
        this.forceSlider = document.getElementById('forceSlider');
        this.angleValue  = document.getElementById('angleValue');
        this.forceValue  = document.getElementById('forceValue');
        this.shootButton = document.getElementById('shootButton');
        this.resetButton = document.getElementById('resetButton');

        // Placar e timer UI
        this.scoreElement   = document.getElementById('score');
        this.timerDisplay   = document.getElementById('timerDisplay');
        this.timerSecondsEl = document.getElementById('timerSeconds');
        this.timerToggleBtn = document.getElementById('timerToggleBtn');
        this.timerResetBtn  = document.getElementById('timerResetBtn');

        // Configurações do jogo
        this.gravity = 0.3;
        this.score = 0;

        // Posições
        this.shooterPos = { x: 100, y: this.canvas.height - 100 };

        // Cesta 30% menor
        this.basketPos = { x: this.canvas.width - 150, y: 150 };
        this.basketWidthBase  = 80;
        this.basketHeightBase = 15;
        this.basketWidth  = Math.round(this.basketWidthBase * 0.7);  // 56
        this.basketHeight = Math.round(this.basketHeightBase * 0.7); // 11

        // Bola
        this.balls = [];
        this.ballRadius = 12;

        // Timer (regressivo)
        this.timerDuration = Number(this.timerSecondsEl.value) || 30; // segundos
        this.timeLeft = this.timerDuration;
        this.timerRunning = false;
        this.timerInterval = null;

        this.init();
      }

      init() {
        this.setupEventListeners();
        this.updateScore();
        this.updateTimerLabel();
        this.gameLoop();
      }

      setupEventListeners() {
        // Sliders
        this.angleSlider.addEventListener('input', (e) => {
          this.angleValue.textContent = e.target.value + '°';
        });
        this.forceSlider.addEventListener('input', (e) => {
          this.forceValue.textContent = e.target.value;
        });

        // Botões
        this.shootButton.addEventListener('click', () => this.shoot());
        this.resetButton.addEventListener('click', () => this.reset());

        // Timer UI
        this.timerSecondsEl.addEventListener('input', () => {
          const v = Math.max(1, Math.min(3600, Number(this.timerSecondsEl.value || 0)));
          this.timerSecondsEl.value = v;
          if (!this.timerRunning) {
            this.timerDuration = v;
            this.timeLeft = v;
            this.updateTimerLabel();
          }
        });
        this.timerToggleBtn.addEventListener('click', () => this.toggleTimer());
        this.timerResetBtn.addEventListener('click', () => this.resetTimer());

        // Teclado
        document.addEventListener('keydown', (e) => {
          const activeTag = document.activeElement && document.activeElement.tagName;
          const editingInput = activeTag === 'INPUT' || activeTag === 'TEXTAREA';

          // Barra de espaço -> shoot (se não estiver digitando em input)
          if (e.code === 'Space' && !editingInput) {
            e.preventDefault();
            this.shoot();
            return;
          }

          // Setas: ignorar se editando inputs (para não atrapalhar)
          if (editingInput) return;

          // Ajustes finos
          const angleStep = 1; // grau
          const forceStep = 1;

          if (e.code === 'ArrowLeft') {
            e.preventDefault();
            const v = Math.max(0, Number(this.angleSlider.value) - angleStep);
            this.angleSlider.value = v;
            this.angleValue.textContent = v + '°';
          } else if (e.code === 'ArrowRight') {
            e.preventDefault();
            const v = Math.min(90, Number(this.angleSlider.value) + angleStep);
            this.angleSlider.value = v;
            this.angleValue.textContent = v + '°';
          } else if (e.code === 'ArrowUp') {
            e.preventDefault();
            const v = Math.min(Number(this.forceSlider.max), Number(this.forceSlider.value) + forceStep);
            this.forceSlider.value = v;
            this.forceValue.textContent = v;
          } else if (e.code === 'ArrowDown') {
            e.preventDefault();
            const v = Math.max(Number(this.forceSlider.min), Number(this.forceSlider.value) - forceStep);
            this.forceSlider.value = v;
            this.forceValue.textContent = v;
          }
        });
      }

      // Timer
      toggleTimer() {
        if (this.timerRunning) {
          this.pauseTimer();
        } else {
          this.startTimer();
        }
      }
      startTimer() {
        if (this.timeLeft <= 0) {
          this.timeLeft = Number(this.timerSecondsEl.value) || 30;
        }
        this.timerRunning = true;
        this.timerToggleBtn.textContent = 'Pausar';
        if (this.timerInterval) clearInterval(this.timerInterval);
        this.timerInterval = setInterval(() => {
          this.timeLeft = Math.max(0, this.timeLeft - 1);
          this.updateTimerLabel();
          if (this.timeLeft <= 0) {
            this.pauseTimer();
          }
        }, 1000);
      }
      pauseTimer() {
        this.timerRunning = false;
        this.timerToggleBtn.textContent = 'Iniciar';
        if (this.timerInterval) {
          clearInterval(this.timerInterval);
          this.timerInterval = null;
        }
      }
      resetTimer() {
        this.pauseTimer();
        this.timerDuration = Number(this.timerSecondsEl.value) || 30;
        this.timeLeft = this.timerDuration;
        this.updateTimerLabel();
      }
      updateTimerLabel() {
        const m = Math.floor(this.timeLeft / 60);
        const s = this.timeLeft % 60;
        const mm = String(m).padStart(2, '0');
        const ss = String(s).padStart(2, '0');
        this.timerDisplay.textContent = `⏱ ${mm}:${ss}`;
      }

      shoot() {
        // Debounce via disabled button
        if (this.shootButton.disabled) return;

        const angle = parseFloat(this.angleSlider.value) * Math.PI / 180;
        const force = parseFloat(this.forceSlider.value);

				const ball = {
				  x: this.shooterPos.x + 30,
				  y: this.shooterPos.y,
				  vx: Math.cos(angle) * force,
				  vy: -Math.sin(angle) * force,
				  prevX: this.shooterPos.x + 30,
				  prevY: this.shooterPos.y,
				  trail: [],
				  hasScored: false
				};


        this.balls.push(ball);

        // Desabilita o botão por 1s para evitar spam
        this.shootButton.disabled = true;
        setTimeout(() => (this.shootButton.disabled = false), 1000);
      }

      reset() {
        this.balls = [];
        this.score = 0;
        this.updateScore();

        // Cesta de volta à posição inicial
        this.basketPos = { x: this.canvas.width - 150, y: 150 };

        // Zera também o timer, mas respeita o valor digitado
        this.resetTimer();
      }

      updateBalls() {
        // Atualiza física e checa colisões
        for (let i = this.balls.length - 1; i >= 0; i--) {
          const ball = this.balls[i];

          // Trilha
          ball.trail.push({ x: ball.x, y: ball.y });
          if (ball.trail.length > 15) ball.trail.shift();

					// Antes de aplicar gravidade e movimentar:
					ball.prevX = ball.x;
					ball.prevY = ball.y;
					
					// Física
					ball.vy += this.gravity;
					ball.x  += ball.vx;
					ball.y  += ball.vy;


          // Colisão com a cesta (uma vez por bola)
          if (!ball.hasScored) this.checkBasketCollision(ball);

          // Remover fora da tela
          if (ball.x > this.canvas.width + 50 || ball.y > this.canvas.height + 50) {
            this.balls.splice(i, 1);
          }
        }
      }

			checkBasketCollision(ball) {
			  if (ball.hasScored) return;
			
			  const left   = this.basketPos.x - this.basketWidth / 2;
			  const right  = this.basketPos.x + this.basketWidth / 2;
			  const top    = this.basketPos.y;
			
			  // Só conta se está descendo
			  if (ball.vy <= 0) return;
			
			  // Topo da bola no frame anterior e atual
			  const prevTop = ball.prevY - this.ballRadius;
			  const currTop = ball.y      - this.ballRadius;
			
			  // O topo da bola cruzou a linha do aro (y = top) entre os frames?
			  if (prevTop <= top && currTop >= top) {
			    // Fração do frame em que o cruzamento ocorreu
			    const t = (top - prevTop) / (currTop - prevTop); // 0..1
			    // X no momento exato do cruzamento
			    const xCross = ball.prevX + t * (ball.x - ball.prevX);
			
			    // Pequena folga horizontal para evitar "bordas fantasmas"
			    const pad = 1.5;
			    if (xCross >= left + pad && xCross <= right - pad) {
			      ball.hasScored = true;
			      this.score++;
			      this.updateScore();
			      this.moveBasketToNewPosition();
			      setTimeout(() => {
			        const idx = this.balls.indexOf(ball);
			        if (idx > -1) this.balls.splice(idx, 1);
			      }, 80);
			    }
			  }
			}



      moveBasketToNewPosition() {
        const minX = 150;
        const maxX = this.canvas.width - 150;
        const minY = 80;
        const maxY = this.canvas.height - 150;

        this.basketPos.x = minX + Math.random() * (maxX - minX);
        this.basketPos.y = minY + Math.random() * (maxY - minY);
      }

      updateScore() {
        this.scoreElement.textContent = `Score: ${this.score}`;
      }

      draw() {
        const ctx = this.ctx;
        ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        // Cesta
        this.drawBasket();

        // Atirador
        this.drawShooter();

        // Bolas + trilhas
        for (const b of this.balls) {
          this.drawBallTrail(b);
          this.drawBall(b);
        }

        // Mira
        this.drawAim();
      }

      drawBasket() {
        const ctx = this.ctx;

        // Aro / tabela
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(
          this.basketPos.x - this.basketWidth / 2,
          this.basketPos.y,
          this.basketWidth,
          this.basketHeight
        );

        // Suportes laterais
        ctx.fillStyle = '#A0522D';
        ctx.fillRect(this.basketPos.x - this.basketWidth / 2 - 3, this.basketPos.y, 3, 16);
        ctx.fillRect(this.basketPos.x + this.basketWidth / 2, this.basketPos.y, 3, 16);

        // Rede estilizada
        ctx.strokeStyle = '#FFF';
        ctx.lineWidth = 1;
        for (let i = 0; i < 3; i++) {
          const x = this.basketPos.x - this.basketWidth / 2 + (i * this.basketWidth / 2);
          ctx.beginPath();
          ctx.moveTo(x, this.basketPos.y + this.basketHeight);
          ctx.lineTo(x + 5, this.basketPos.y + this.basketHeight + 12);
          ctx.stroke();
        }
      }

      drawShooter() {
        const ctx = this.ctx;

        // Base
        ctx.fillStyle = '#4A4A4A';
        ctx.fillRect(this.shooterPos.x - 20, this.shooterPos.y, 40, 30);

        // Canhão
        const angle = parseFloat(this.angleSlider.value) * Math.PI / 180;
        ctx.save();
        ctx.translate(this.shooterPos.x, this.shooterPos.y);
        ctx.rotate(-angle);
        ctx.fillStyle = '#666';
        ctx.fillRect(0, -8, 50, 16);
        ctx.restore();
      }

      drawBall(ball) {
        const ctx = this.ctx;

        // Sombra
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.arc(ball.x + 2, ball.y + 2, this.ballRadius, 0, Math.PI * 2);
        ctx.fill();

        // Esfera
        const gradient = ctx.createRadialGradient(
          ball.x - 4, ball.y - 4, 0,
          ball.x, ball.y, this.ballRadius
        );
        gradient.addColorStop(0, '#FF8C00');
        gradient.addColorStop(1, '#FF6B00');

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, this.ballRadius, 0, Math.PI * 2);
        ctx.fill();

        // Linhas
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, this.ballRadius - 2, 0, Math.PI * 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(ball.x - this.ballRadius + 2, ball.y);
        ctx.lineTo(ball.x + this.ballRadius - 2, ball.y);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(ball.x, ball.y - this.ballRadius + 2);
        ctx.lineTo(ball.x, ball.y + this.ballRadius - 2);
        ctx.stroke();
      }

      drawBallTrail(ball) {
        const ctx = this.ctx;
        if (ball.trail.length > 1) {
          for (let i = 1; i < ball.trail.length; i++) {
            const alpha = i / ball.trail.length;
            ctx.strokeStyle = `rgba(255, 140, 0, ${alpha * 0.5})`;
            ctx.lineWidth = 3 * alpha;
            ctx.beginPath();
            ctx.moveTo(ball.trail[i - 1].x, ball.trail[i - 1].y);
            ctx.lineTo(ball.trail[i].x, ball.trail[i].y);
            ctx.stroke();
          }
        }
      }

      drawAim() {
        const ctx = this.ctx;
        const angle = parseFloat(this.angleSlider.value) * Math.PI / 180;
        const force = parseFloat(this.forceSlider.value);

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);

        ctx.beginPath();
        ctx.moveTo(this.shooterPos.x + 30, this.shooterPos.y);
        ctx.lineTo(
          this.shooterPos.x + 30 + Math.cos(angle) * force * 8,
          this.shooterPos.y - Math.sin(angle) * force * 8
        );
        ctx.stroke();

        ctx.setLineDash([]);
      }

      gameLoop() {
        this.updateBalls();
        this.draw();
        requestAnimationFrame(() => this.gameLoop());
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      new BasketballShooter();
    });
  </script>
</body>
</html>
