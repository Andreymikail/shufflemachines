  // Links each checkbox to its cards and actions
  const groups = [
    { checkbox: "catsCheckbox", cards: cats, actions: catsActions },
    { checkbox: "primatesCheckbox", cards: primates, actions: primatesActions },
    { checkbox: "marineCheckbox", cards: marine, actions: marineActions },
    { checkbox: "giantsCheckbox", cards: giants, actions: giantsActions },
    { checkbox: "birdsCheckbox", cards: birds, actions: birdsActions },
    { checkbox: "reptilesCheckbox", cards: reptiles, actions: reptilesActions },
    { checkbox: "fishCheckbox", cards: fish, actions: fishActions },
    { checkbox: "bearsCheckbox", cards: bears, actions: bearsActions },
    { checkbox: "hoofedCheckbox", cards: hoofed, actions: hoofedActions },
    { checkbox: "invertsCheckbox", cards: inverts, actions: invertsActions }
  ];

  // Shuffle array (Fisher-Yates)
  function shuffleArray(array) {
    const copy = [...array];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function selectedGroups() {
    return groups.filter(g => document.getElementById(g.checkbox).checked);
  }

  // Function to gather selected groups and shuffle
  function shuffleCards() {
    const selectedCards = [];
    selectedGroups().forEach(g => selectedCards.push(...g.cards));

    if (selectedCards.length === 0) {
      alert("Please select at least one animal group!");
      return;
    }

    const shuffledCards = shuffleArray(selectedCards);
    const cardsPerPage = Math.max(1, parseInt(document.getElementById('cardsPerPageInput').value, 10) || 5);
    displayPaginatedCards(shuffledCards, cardsPerPage);
  }

  // Function to display paginated cards
  function displayPaginatedCards(cards, cardsPerPage) {
    const cardsContainer = document.getElementById('cardsContainer');
    cardsContainer.innerHTML = '';

    for (let i = 0; i < cards.length; i += cardsPerPage) {
      const pageDiv = document.createElement('div');
      pageDiv.className = 'page';

      const cardHtml = cards.slice(i, i + cardsPerPage).map(card => `
        <h3>${card.name}</h3>
        <p>${Object.entries(card.attributes).map(([key, value]) =>
          `${key}: ${typeof value === 'number' ? value.toLocaleString('en-US') : value}`).join(' | ')}</p>
      `).join('<br>');

      pageDiv.innerHTML = `<h3>Page ${(i / cardsPerPage) + 1}</h3>${cardHtml}`;
      cardsContainer.appendChild(pageDiv);
    }
  }

  // Draws one action: general actions + actions of the selected groups
  // (if no group is selected, every action can be drawn)
  function shuffleAction() {
    const chosen = selectedGroups();
    const pool = [...actions];
    (chosen.length ? chosen : groups).forEach(g => pool.push(...g.actions));
    const randomAction = pool[Math.floor(Math.random() * pool.length)];
    document.getElementById('actionResult').innerHTML = randomAction.replace(/\n/g, '<br>');
  }

  document.getElementById('shuffleActionButton').addEventListener('click', shuffleAction);
  document.getElementById('startButton').addEventListener('click', shuffleCards);
</script>
