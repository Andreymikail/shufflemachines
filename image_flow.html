<div id="image-flow-widget" style="text-align:center; color:white; font-family:Arial, sans-serif;">
  <style>
    #image-flow-widget {
      background: black;
      padding: 20px 10px;
      box-sizing: border-box;
    }

    #image-flow-widget .ifw-title {
      margin: 0 0 12px 0;
      font-size: 32px;
      color: white;
    }

    #image-flow-widget .ifw-controls {
      margin-bottom: 14px;
    }

    #image-flow-widget button,
    #image-flow-widget input {
      margin: 6px;
      padding: 8px 12px;
      font-size: 14px;
      color: white;
      border: none;
      border-radius: 6px;
      box-sizing: border-box;
    }

    #image-flow-widget button {
      background: #E4C58A;
      font-weight: bold;
      cursor: pointer;
      min-width: 70px;
      height: 40px;
    }

    #image-flow-widget button:hover {
      background: #6E1919;
      color: white;
    }

    #image-flow-widget .ifw-hint {
      font-size: 14px;
      opacity: 0.9;
      margin: 8px 0 16px;
      color: white;
    }

    #image-flow-widget .ifw-viewer {
      width: 500px;
      height: 300px;
      max-width: 95vw;
      margin: 0 auto 20px auto;
      border: 4px solid #333;
      background: #111;
      position: relative;
      overflow: hidden;
      box-sizing: border-box;
    }

    #image-flow-widget .ifw-tile-layer {
      position: absolute;
      inset: 0;
      will-change: transform;
    }

    #image-flow-widget .ifw-tile {
      position: absolute;
      background-repeat: no-repeat;
      background-size: 100% 100%;
      image-rendering: auto;
    }

    #image-flow-widget .ifw-status {
      margin-top: 8px;
      font-size: 14px;
      opacity: 0.9;
      color: white;
    }

    #image-flow-widget .ifw-viewer:fullscreen {
      width: 100vw;
      height: 100vh;
      max-width: none;
      border: none;
    }
  </style>

  <h1 class="ifw-title">Image Flow</h1>

  <div class="ifw-controls">
    <button type="button" class="ifw-start">▶</button>
    <button type="button" class="ifw-stop">■</button>
    <button type="button" class="ifw-fullscreen">[]</button>
    <br>
    <input type="file" class="ifw-file" accept="image/*">
  </div>

  <div class="ifw-hint">
    Arrow keys: control direction and speed · Spacebar: pause/resume
  </div>

  <div class="ifw-viewer">
    <div class="ifw-tile-layer"></div>
  </div>

  <div class="ifw-status">
    Direction: right | Speed: 120 px/s | State: paused
  </div>

  <script>
    (function () {
      const widget = document.getElementById("image-flow-widget");
      if (!widget) return;

      const startBtn = widget.querySelector(".ifw-start");
      const stopBtn = widget.querySelector(".ifw-stop");
      const fullscreenBtn = widget.querySelector(".ifw-fullscreen");
      const fileInput = widget.querySelector(".ifw-file");
      const viewer = widget.querySelector(".ifw-viewer");
      const tileLayer = widget.querySelector(".ifw-tile-layer");
      const statusEl = widget.querySelector(".ifw-status");

      let running = false;
      let rafId = null;
      let lastTime = null;

      let imageUrl = "";
      let tileWidth = 200;
      let tileHeight = 200;

      let offsetX = 0;
      let offsetY = 0;

      let direction = "right";
      let speed = 120;
      const speedStep = 20;
      const minSpeed = 0;
      const maxSpeed = 800;

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function getOppositeDirection(dir) {
        const opposites = {
          right: "left",
          left: "right",
          up: "down",
          down: "up"
        };
        return opposites[dir];
      }

      function isSameAxis(dirA, dirB) {
        const horizontal = ["left", "right"];
        const vertical = ["up", "down"];

        return (
          (horizontal.includes(dirA) && horizontal.includes(dirB)) ||
          (vertical.includes(dirA) && vertical.includes(dirB))
        );
      }

      function updateStatus() {
        statusEl.textContent =
          "Direction: " + direction +
          " | Speed: " + speed + " px/s" +
          " | State: " + (running ? "running" : "paused");
      }

      function renderTiles() {
        if (!imageUrl) return;

        const wrappedX = ((offsetX % tileWidth) + tileWidth) % tileWidth;
        const wrappedY = ((offsetY % tileHeight) + tileHeight) % tileHeight;

        tileLayer.style.transform = "translate(" + (-wrappedX) + "px, " + (-wrappedY) + "px)";
      }

      function buildTiles() {
        tileLayer.innerHTML = "";
        if (!imageUrl) return;

        const viewerW = viewer.clientWidth;
        const viewerH = viewer.clientHeight;

        const cols = Math.ceil(viewerW / tileWidth) + 3;
        const rows = Math.ceil(viewerH / tileHeight) + 3;

        for (let row = -1; row < rows - 1; row++) {
          for (let col = -1; col < cols - 1; col++) {
            const tile = document.createElement("div");
            tile.className = "ifw-tile";
            tile.style.width = tileWidth + "px";
            tile.style.height = tileHeight + "px";
            tile.style.left = (col * tileWidth) + "px";
            tile.style.top = (row * tileHeight) + "px";
            tile.style.backgroundImage = 'url("' + imageUrl + '")';
            tileLayer.appendChild(tile);
          }
        }

        renderTiles();
      }

      function animate(time) {
        if (!running) return;

        if (!lastTime) lastTime = time;
        const dt = (time - lastTime) / 1000;
        lastTime = time;

        switch (direction) {
          case "right":
            offsetX += speed * dt;
            break;
          case "left":
            offsetX -= speed * dt;
            break;
          case "up":
            offsetY -= speed * dt;
            break;
          case "down":
            offsetY += speed * dt;
            break;
        }

        renderTiles();
        rafId = requestAnimationFrame(animate);
      }

      function start() {
        if (!imageUrl) return;
        if (running) return;
        running = true;
        lastTime = null;
        updateStatus();
        rafId = requestAnimationFrame(animate);
      }

      function stop() {
        running = false;
        if (rafId) cancelAnimationFrame(rafId);
        rafId = null;
        lastTime = null;
        updateStatus();
      }

      function toggleRun() {
        if (running) stop();
        else start();
      }

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          if (viewer.requestFullscreen) {
            viewer.requestFullscreen();
          }
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen();
          }
        }
      }

      function loadImage(file) {
        if (!file) return;

        if (imageUrl && imageUrl.startsWith("blob:")) {
          URL.revokeObjectURL(imageUrl);
        }

        imageUrl = URL.createObjectURL(file);

        const img = new Image();
        img.onload = function () {
          tileWidth = img.width;
          tileHeight = img.height;
          offsetX = 0;
          offsetY = 0;
          buildTiles();
          updateStatus();
        };
        img.src = imageUrl;
      }

      function handleKeydown(e) {
        const tag = e.target && e.target.tagName ? e.target.tagName.toLowerCase() : "";
        const typing = tag === "input" || tag === "textarea" || tag === "select";

        if (e.code === "Space") {
          e.preventDefault();
          toggleRun();
          return;
        }

        if (typing) return;

        let requestedDirection = null;

        switch (e.code) {
          case "ArrowRight":
            e.preventDefault();
            requestedDirection = "right";
            break;
          case "ArrowLeft":
            e.preventDefault();
            requestedDirection = "left";
            break;
          case "ArrowUp":
            e.preventDefault();
            requestedDirection = "up";
            break;
          case "ArrowDown":
            e.preventDefault();
            requestedDirection = "down";
            break;
          default:
            return;
        }

        if (requestedDirection === direction) {
          speed = clamp(speed + speedStep, minSpeed, maxSpeed);
        } else if (requestedDirection === getOppositeDirection(direction)) {
          speed = clamp(speed - speedStep, minSpeed, maxSpeed);

          if (speed === 0) {
            direction = requestedDirection;
            speed = speedStep;
          }
        } else if (isSameAxis(requestedDirection, direction)) {
          direction = requestedDirection;
        } else {
          direction = requestedDirection;
          if (speed === 0) {
            speed = speedStep;
          }
        }

        updateStatus();
      }

      startBtn.addEventListener("click", start);
      stopBtn.addEventListener("click", stop);
      fullscreenBtn.addEventListener("click", toggleFullscreen);

      fileInput.addEventListener("change", function () {
        const file = fileInput.files && fileInput.files[0];
        loadImage(file);
      });

      document.addEventListener("keydown", handleKeydown);

      window.addEventListener("resize", function () {
        if (imageUrl) buildTiles();
      });

      updateStatus();
    })();
  </script>
</div>
