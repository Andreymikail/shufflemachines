<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Image Spin Overlay</title>
</head>

<body>

<div style="text-align:center;">
  <h1>Image Spin</h1>
  <br>
</div>

<!-- CONTROLES -->
<div class="controls">

  <button id="startBtn" title="Start">▶</button>
  <button id="stopBtn" title="Stop">■</button>
  <button id="fullscreenBtn" title="Fullscreen">[]</button>

  <br><br>

  <p>Speed (seconds / turn):</p>
  <input type="number" id="speedInput" value="2" min="0.05" step="0.5">

  <br><br>

  <p>Preset:</p>
  <select id="presetSelect">
    <option value="">-- select --</option>
  </select>

  <br><br>

  <p>Load Image 1 (Clockwise):</p>
  <input type="file" id="file1" accept="image/*">

  <br><br>

  <p>Load Image 2 (Counter):</p>
  <input type="file" id="file2" accept="image/*">

</div>

<!-- AREA DE ROTAÇÃO -->
<div class="spin-container">

  <!-- CAMADA 1 -->
  <div class="layer" id="layer1">
    <div class="bmp" id="bmp1"></div>
  </div>

  <!-- CAMADA 2 -->
  <div class="layer" id="layer2">
    <div class="bmp" id="bmp2"></div>
  </div>

</div>

<script>
const IMAGE_SETS = {
  "Roulette": {
    cw: "https://images.squarespace-cdn.com/content/v1/66be651a2ed73a62cf27f270/af77cefe-7ef0-4c3e-ba97-7bc8e505a830/roulette.png",
    ccw: "https://images.squarespace-cdn.com/content/v1/66be651a2ed73a62cf27f270/a64848be-6179-4f8c-b0fc-d84bc372387c/ball.png"
  },
  "Preset A": {
    cw: "https://images.squarespace-cdn.com/content/v1/66be651a2ed73a62cf27f270/c39420e3-a731-42c0-bf22-329ba9240118/01.png",
    ccw: "https://images.squarespace-cdn.com/content/v1/66be651a2ed73a62cf27f270/89b10f14-46a2-4c97-b7e2-0e984952af5a/02.png"
  },
  "Preset B": {
    cw: "https://images.squarespace-cdn.com/content/v1/66be651a2ed73a62cf27f270/3ad3fec4-61a8-4a56-8616-afdfffcb519c/03.png",
    ccw: "https://images.squarespace-cdn.com/content/v1/66be651a2ed73a62cf27f270/255d427a-cbe7-46e2-b607-a05ddeb3f6cd/04.png"
  }
};


const startBtn = document.getElementById("startBtn");
const stopBtn  = document.getElementById("stopBtn");
const speedInput = document.getElementById("speedInput");

const file1 = document.getElementById("file1");
const file2 = document.getElementById("file2");

const presetSelect = document.getElementById("presetSelect");

const bmp1 = document.getElementById("bmp1");
const bmp2 = document.getElementById("bmp2");

const layer1 = document.getElementById("layer1");
const layer2 = document.getElementById("layer2");

const fullscreenBtn = document.getElementById("fullscreenBtn");
const container = document.querySelector(".spin-container");

let running = false;
let rafId = null;

let angle1 = 0;
let angle2 = 0;

let lastTime = null;

/* ===== Helpers ===== */

function clamp(n, min, max) {
  return Math.min(max, Math.max(min, n));
}

function setBackgroundImage(target, url) {
  if (!url) return;
  // Para URLs do site
  target.style.backgroundImage = `url("${url}")`;
}

/* ===== Preset Combo ===== */

function populatePresets() {
  Object.keys(IMAGE_SETS).forEach((name) => {
    const opt = document.createElement("option");
    opt.value = name;
    opt.textContent = name;
    presetSelect.appendChild(opt);
  });
}

function applyPreset(name) {
  const preset = IMAGE_SETS[name];
  if (!preset) return;

  // Carrega as duas imagens
  setBackgroundImage(bmp1, preset.cw);
  setBackgroundImage(bmp2, preset.ccw);

  // Opcional: limpa file inputs para evitar confusão visual
  file1.value = "";
  file2.value = "";
}

/* ===== Carrega imagens locais ===== */

function loadLocalFile(input, target) {
  const file = input.files && input.files[0];
  if (!file) return;

  const url = URL.createObjectURL(file);
  setBackgroundImage(target, url);
}

/* ===== Loop de animação ===== */

function animate(time) {
  if (!running) return;

  if (!lastTime) lastTime = time;

  const dt = (time - lastTime) / 1000;
  lastTime = time;

  const secondsPerTurn = Math.max(0.05, Number(speedInput.value) || 2);
  const degPerSec = 360 / secondsPerTurn;

  // Horário
  angle1 += degPerSec * dt;

  // Anti-horário
  angle2 -= degPerSec * dt;

  layer1.style.transform = `rotate(${angle1}deg)`;
  layer2.style.transform = `rotate(${angle2}deg)`;

  rafId = requestAnimationFrame(animate);
}

/* ===== Controles Start/Stop ===== */

function start() {
  if (running) return;
  running = true;
  lastTime = null;
  rafId = requestAnimationFrame(animate);
}

function stop() {
  running = false;
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null;
  lastTime = null;
}

function toggleRun() {
  if (running) stop();
  else start();
}

/* ===== Fullscreen ===== */

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    container.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
}

/* ===== 1) / 2) Teclado =====
   - Espaço: start/stop
   - ArrowUp: mais rápido (reduz seconds/turn)
   - ArrowDown: mais lento (aumenta seconds/turn)
*/
function handleKeydown(e) {
  // Não roubar tecla quando digitando no input
  const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : "";
  const isTypingField = tag === "input" || tag === "textarea" || tag === "select";

  if (e.code === "Space") {
    e.preventDefault(); // evita scroll
    toggleRun();
    return;
  }

  if (e.code === "ArrowUp" || e.code === "ArrowDown") {
    // se estiver no input number, ainda assim queremos permitir o atalho?
    // Aqui eu permito mesmo fora de campo de texto; se preferir sempre, remova o if.
    if (isTypingField && tag !== "select") return;

    e.preventDefault();

    const current = Number(speedInput.value) || 2;

    // Regra: Speed é seconds/turn. Menor = mais rápido.
    const step = Number(speedInput.step) || 0.1;

    let next = current;
    if (e.code === "ArrowUp") next = current - step;
    if (e.code === "ArrowDown") next = current + step;

    next = clamp(next, Number(speedInput.min) || 0.05, 999);
    speedInput.value = next.toFixed(2).replace(/\.00$/, ""); // estética
  }
}

/* ===== Events ===== */

startBtn.addEventListener("click", start);
stopBtn.addEventListener("click", stop);

fullscreenBtn.addEventListener("click", toggleFullscreen);

file1.addEventListener("change", () => loadLocalFile(file1, bmp1));
file2.addEventListener("change", () => loadLocalFile(file2, bmp2));

presetSelect.addEventListener("change", (e) => {
  const name = e.target.value;
  if (name) applyPreset(name);
});

document.addEventListener("keydown", handleKeydown);

/* ===== Init ===== */
populatePresets();

// Se quiser iniciar com um preset padrão, descomente:
// presetSelect.value = "Preset A (Logo + Rings)";
// applyPreset(presetSelect.value);

</script>

<style>
body {
  background: black;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

.hint {
  margin: 0;
  opacity: 0.85;
  font-size: 14px;
}

/* CONTROLES */
.controls {
  margin-bottom: 20px;
}

/* AREA PRINCIPAL */
.spin-container {
  width: 240px;
  height: 240px;

  margin: auto;

  border: 8px solid #333;
  border-radius: 50%;

  position: relative;
  background: #111;
  overflow: hidden;

  display: flex;
  align-items: center;
  justify-content: center;
}

/* CADA CAMADA */
.layer {
  position: absolute;
  width: 200px;
  height: 200px;

  display: flex;
  align-items: center;
  justify-content: center;

  transform-origin: center center;
}

/* BMP */
.bmp {
  width: 200px;
  height: 200px;

  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;

  image-rendering: pixelated;
}

/* FULLSCREEN */
.spin-container:fullscreen {
  width: 100vw;
  height: 100vw;

  max-width: 100vh;
  max-height: 100vh;

  border-radius: 0;
  border: none;
}

/* BOTÕES */
button {
  width: 70px;
  height: 40px;

  border-radius: 6px;
  border: none;

  background: #E4C58A;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #6E1919;
  color: white;
}

input, select {
  margin-top: 5px;
}

h1, p, label {
  color: white;
}

select {
  width: 260px;
  height: 34px;
}
</style>

</body>
</html>
