<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Image Spin Overlay</title>
</head>

<body>

<div style="text-align:center;">
  <h1>Image Spin</h1>
  <br><br>
</div>

<!-- CONTROLES -->
<div class="controls">

  <button id="startBtn">▶</button>
  <button id="stopBtn">■</button>
  <button id="fullscreenBtn">[]</button>

  <br><br>

  <p>Speed (seconds / turn):</p>
  <input type="number" id="speedInput" value="2" min="0.1" step="0.1">

  <br><br>

  <p>Image 1 (Clockwise):</p>
  <input type="file" id="file1" accept="image/*">

  <br><br>

  <p>Image 2 (Counter):</p>
  <input type="file" id="file2" accept="image/*">

</div>


<!-- AREA DE ROTAÇÃO -->
<div class="spin-container">

  <!-- CAMADA 1 -->
  <div class="layer" id="layer1">
    <div class="bmp" id="bmp1"></div>
  </div>

  <!-- CAMADA 2 -->
  <div class="layer" id="layer2">
    <div class="bmp" id="bmp2"></div>
  </div>

</div>


<script>

const startBtn = document.getElementById("startBtn");
const stopBtn  = document.getElementById("stopBtn");

const speedInput = document.getElementById("speedInput");

const file1 = document.getElementById("file1");
const file2 = document.getElementById("file2");

const bmp1 = document.getElementById("bmp1");
const bmp2 = document.getElementById("bmp2");

const layer1 = document.getElementById("layer1");
const layer2 = document.getElementById("layer2");

const fullscreenBtn = document.getElementById("fullscreenBtn");
const container = document.querySelector(".spin-container");

let running = false;
let rafId = null;

let angle1 = 0;
let angle2 = 0;

let lastTime = null;


/* CARREGA BMP */

function loadBMP(input, target) {

  const file = input.files[0];
  if (!file) return;

  const url = URL.createObjectURL(file);
  target.style.backgroundImage = `url('${url}')`;
}


/* LOOP DE ANIMAÇÃO */

function animate(time) {

  if (!running) return;

  if (!lastTime) lastTime = time;

  const dt = (time - lastTime) / 1000;
  lastTime = time;

  const secondsPerTurn = Math.max(0.05, Number(speedInput.value));
  const degPerSec = 360 / secondsPerTurn;

  // Horário
  angle1 += degPerSec * dt;

  // Anti-horário
  angle2 -= degPerSec * dt;

  layer1.style.transform = `rotate(${angle1}deg)`;
  layer2.style.transform = `rotate(${angle2}deg)`;

  rafId = requestAnimationFrame(animate);
}


/* CONTROLES */

function start() {

  if (running) return;

  running = true;
  lastTime = null;

  rafId = requestAnimationFrame(animate);
}

function stop() {

  running = false;

  if (rafId) cancelAnimationFrame(rafId);

  rafId = null;
  lastTime = null;
}


/* EVENTS */

startBtn.addEventListener("click", start);
stopBtn.addEventListener("click", stop);

file1.addEventListener("change", () => loadBMP(file1, bmp1));
file2.addEventListener("change", () => loadBMP(file2, bmp2));



fullscreenBtn.addEventListener("click", toggleFullscreen);

function toggleFullscreen() {

  if (!document.fullscreenElement) {

    container.requestFullscreen();

  } else {

    document.exitFullscreen();

  }
}

</script>


<style>

body {
  background: black;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}


/* CONTROLES */

.controls {
  margin-bottom: 25px;
}


/* AREA PRINCIPAL */

.spin-container {

  width: 240px;
  height: 240px;

  margin: auto;

  border: 8px solid #333;
  border-radius: 50%;

  position: relative;

  background: #111;

  overflow: hidden;

  display: flex;
  align-items: center;
  justify-content: center;
}


/* CADA CAMADA */

.layer {

  position: absolute;

  width: 200px;
  height: 200px;

  display: flex;
  align-items: center;
  justify-content: center;

  transform-origin: center center;
}


/* BMP */

.bmp {

  width: 200px;
  height: 200px;

  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;

  image-rendering: pixelated;
}


.spin-container:fullscreen {

  width: 100vw;
  height: 100vw;

  max-width: 100vh;
  max-height: 100vh;

  border-radius: 0;
  border: none;
}
/* BOTÕES */

button {

  width: 70px;
  height: 40px;

  border-radius: 6px;
  border: none;

  background: #E4C58A;
  font-weight: bold;
  cursor: pointer;
}

button:hover {

  background: #6E1919;
  color: white;
}


input {

  margin-top: 5px;
}

h1, p, label {
  color: white;
}
</style>

</body>
</html>
